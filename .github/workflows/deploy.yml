name: WIMS UI CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    name: CI - Build Production Artifact
    runs-on: ubuntu-latest
    env:
      CI: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Get current server environment
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"
          ssh -i "$RUNNER_TEMP/deploy_key" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            "$SERVER_USER@$SERVER_HOST" \
            'cat /home/abhiwims/wims-ui/.env' > .env
          chmod 600 .env

      - name: Build production application
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wims-ui-build
          path: build
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: CD - Deploy Build Artifact
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: wims-ui-build
          path: build

      - name: Upload build to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "build"
          target: "/home/abhiwims/wims-ui/deploy-temp"
          rm: true
          timeout: 30s
          command_timeout: 5m

      - name: Activate build
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 2m
          script: |
            set -e

            echo "Activating new build..."
            cd /home/abhiwims/wims-ui

            sudo nginx -t

            rm -rf build.new
            mv deploy-temp/build build.new
            rm -rf build
            mv build.new build
            rm -rf deploy-temp

            sudo systemctl reload nginx

            echo "Deployment completed successfully!"
