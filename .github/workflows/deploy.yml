name: WIMS UI CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    name: CI - Install & Build
    runs-on: ubuntu-latest
    env:
      # CI only needs values that allow the React production build to complete.
      # Real/testing values remain on the production server in .env.
      REACT_APP_SERVERURL: https://ci.invalid
      REACT_APP_USER_ENC_DEC_KEY: ci-build-placeholder-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  deploy:
    name: CD - Deploy to Production
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e

            echo "Starting WIMS UI deployment..."
            cd /home/abhiwims/wims-ui

            echo "Fetching latest main branch..."
            git fetch origin main

            echo "Updating working tree..."
            git reset --hard origin/main

            echo "Installing production dependencies..."
            npm ci

            echo "Building production application using server .env..."
            npm run build

            echo "Deployment completed successfully."
